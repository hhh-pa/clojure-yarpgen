name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: ./target/release/clojure-yarpgen -s 42 -o out/smoke && ls out/smoke
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fetch Clojure jars
        run: |
          mkdir -p /tmp/clj-cp
          cd /tmp/clj-cp
          curl -sSL -O https://repo1.maven.org/maven2/org/clojure/clojure/1.12.0/clojure-1.12.0.jar
          curl -sSL -O https://repo1.maven.org/maven2/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar
          curl -sSL -O https://repo1.maven.org/maven2/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar
      - name: Install Babashka
        uses: turtlequeue/setup-babashka@v1.7.0
        with:
          babashka-version: 1.13.229
      - name: Fuzz end-to-end
        env:
          CLOJURE_CP: /tmp/clj-cp/clojure-1.12.0.jar:/tmp/clj-cp/spec.alpha-0.5.238.jar:/tmp/clj-cp/core.specs.alpha-0.4.74.jar
        run: ./target/release/clojure-yarpgen fuzz -s 1 --count 4 -o out/ci-fuzz
